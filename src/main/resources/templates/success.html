<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Success</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>

        body{
        background:linear-gradient(135deg,#111827,#312e81,#0891b2);
        }

        .glass{
        backdrop-filter:blur(20px);
        background:rgba(255,255,255,.12);
        border:1px solid rgba(255,255,255,.25);
        }

    </style>

</head>

<body class="min-h-screen flex justify-center items-center p-6">

<div class="glass max-w-xl w-full rounded-3xl shadow-2xl p-10 text-center">

    <div class="text-7xl animate-bounce">
        ✅
    </div>

    <h1 class="text-4xl font-bold text-white mt-5">

        Registration Successful

    </h1>

    <p class="text-gray-300 mt-3">

        Student has been registered successfully.

    </p>

    <div class="bg-white rounded-2xl p-6 mt-10 text-left shadow-xl">

        <h2 class="text-2xl font-bold mb-6 text-gray-800">

            Student Details

        </h2>

        <div class="space-y-4">

            <div class="flex justify-between border-b pb-2">

                <span class="font-bold">👤 Name</span>

                <span th:text="${student.name}"></span>

            </div>

            <div class="flex justify-between border-b pb-2">

                <span class="font-bold">🎂 Age</span>

                <span th:text="${student.age}"></span>

            </div>

            <div class="flex justify-between border-b pb-2">

                <span class="font-bold">📧 Email</span>

                <span th:text="${student.email}"></span>

            </div>

            <div class="flex justify-between">

                <span class="font-bold">📱 Mobile</span>

                <span th:text="${student.mobile}"></span>

            </div>

        </div>

    </div>

    <a href="/"

       class="inline-block mt-10

px-8

py-4

rounded-xl

bg-gradient-to-r

from-indigo-600

via-purple-600

to-cyan-500

text-white

font-bold

shadow-xl

hover:scale-105

duration-300">

        ⬅ Back to Form

    </a>

</div>

</body>

</html>
