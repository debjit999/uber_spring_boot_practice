<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Student Registration</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>

        body{
            background:linear-gradient(135deg,#4f46e5,#7c3aed,#06b6d4);
        }

        .glass{
            backdrop-filter:blur(18px);
            background:rgba(255,255,255,.15);
            border:1px solid rgba(255,255,255,.2);
        }

    </style>

</head>

<body class="min-h-screen flex justify-center items-center p-6">

<div class="glass w-full max-w-lg rounded-3xl shadow-2xl p-10">

    <div class="text-center mb-8">

        <div class="text-6xl">🎓</div>

        <h1 class="text-4xl font-bold text-white mt-2">
            Student Registration
        </h1>

        <p class="text-gray-200 mt-2">
            Fill the form below
        </p>

    </div>

    <form th:action="@{/save}" th:object="${student}" method="post" class="space-y-6">

        <!-- Name -->

        <div>

            <label class="text-white font-semibold">
                Full Name
            </label>

            <input
                    type="text"
                    th:field="*{name}"
                    placeholder="Enter your full name"

                    class="w-full mt-2 rounded-xl px-5 py-3
                    bg-white
                    shadow-lg
                    border-2 border-transparent
                    focus:border-blue-500
                    outline-none">

            <p th:errors="*{name}"
               class="text-red-500 font-semibold mt-2"></p>

        </div>

        <!-- Age -->

        <div>

            <label class="text-white font-semibold">
                Age
            </label>

            <input
                    type="number"
                    th:field="*{age}"

                    class="w-full mt-2 rounded-xl px-5 py-3
                    bg-white
                    shadow-lg
                    border-2 border-transparent
                    focus:border-purple-500
                    outline-none">

            <p th:errors="*{age}"
               class="text-red-500 font-semibold mt-2"></p>

        </div>

        <!-- Email -->

        <div>

            <label class="text-white font-semibold">
                Email
            </label>

            <input
                    type="email"
                    th:field="*{email}"

                    placeholder="example@gmail.com"

                    class="w-full mt-2 rounded-xl px-5 py-3
                    bg-white
                    shadow-lg
                    border-2 border-transparent
                    focus:border-cyan-500
                    outline-none">

            <p th:errors="*{email}"
               class="text-red-500 font-semibold mt-2"></p>

        </div>

        <!-- Mobile -->

        <div>

            <label class="text-white font-semibold">
                Mobile Number
            </label>

            <input
                    type="text"
                    th:field="*{mobile}"

                    placeholder="9876543210"

                    class="w-full mt-2 rounded-xl px-5 py-3
                    bg-white
                    shadow-lg
                    border-2 border-transparent
                    focus:border-pink-500
                    outline-none">

            <p th:errors="*{mobile}"
               class="text-red-500 font-semibold mt-2"></p>

        </div>

        <button
                type="submit"

                class="w-full py-4 rounded-xl
                bg-gradient-to-r
                from-indigo-600
                via-purple-600
                to-cyan-500

                hover:scale-105
                duration-300

                text-white
                text-lg
                font-bold
                shadow-xl">

            🚀 Register Student

        </button>

        <button
                type="reset"

                class="w-full py-4 rounded-xl
                bg-gradient-to-r
                from-indigo-600
                via-purple-600
                to-cyan-500

                hover:scale-105
                duration-300

                text-white
                text-lg
                font-bold
                shadow-xl">

            🚀 reset Student

        </button>

    </form>

</div>

</body>

</html>
